[project]
name = "s3ttv-python"
version = "1.0.0"
description = "Python/PyTorch implementation of Spatio-Spectral Structure Tensor Total Variation (S3TTV) for HSI denoising and destriping"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.4",
]

[tool.uv]
package = false

# PyTorch wheels built with CUDA 12.4 (Linux / Windows).
# Change "cu124" to match your CUDA driver (e.g., cu118, cu126, cu128), or see README.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
